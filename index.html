<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f5ff,0x526044,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-20,35,20);
sun.castShadow=true;
scene.add(sun);

const material=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const colors=[['पिवळा',0xffc928],['लाल',0xd92d24],['निळा',0x1976d2],['हिरवा',0x229447],['काळा',0x20252b],['नारिंगी',0xf07816]];
const vehicles=['ट्रॅक्टर क्लासिक','ट्रॅक्टर मॉडर्न','ट्रॅक्टर हेवी','ट्रॅक्टर कॉम्पॅक्ट','बाईक','स्कूटर','कार','जीप','ट्रक','रोड रोलर','JCB','ट्रेन','विमान','हेलिकॉप्टर'];
const attachments=['काही नाही','ट्रॉली','नांगर','कल्टिव्हेटर','रोटाव्हेटर','फ्रंट लोडर'];
const worlds=['गाव','जंगल','डोंगर','समुद्रकिनारा','हायवे','धबधबा','आकाश'];

let vehicle=vehicles[0],paint=colors[0][1],attachment=attachments[0],tire='खोल ग्रिप',environment='गाव';
let size=1,power=1,wheelSize=1;
let car=null,bodyMat=null,wheels=[],worldObjects=[],obstacles=[];
let playing=false,air=false,velocity=0,points=0,altitude=0;
let cameraMode='chase',rear=false;
const keys={left:false,right:false,forward:false,reverse:false,up:false,down:false};

function addButtonGroup(id,items,current,select){
 const root=$(id);root.innerHTML='';
 items.forEach(item=>{
  const b=document.createElement('button');
  b.textContent=Array.isArray(item)?item[0]:item;
  if((Array.isArray(item)?item[1]:item)===current)b.classList.add('active');
  b.onclick=()=>{
   select(item);
   [...root.children].forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
  };
  root.appendChild(b);
 });
}
function box(parent,w,h,d,mat,x,y,z){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;
 parent.add(o);return o;
}
function clearVehicle(){if(car)scene.remove(car);wheels=[]}
function makeVehicle(){
 clearVehicle();
 car=new THREE.Group();scene.add(car);
 bodyMat=material(paint,.4);
 const isTractor=vehicle.startsWith('ट्रॅक्टर');
 const isBike=['बाईक','स्कूटर'].includes(vehicle);
 air=['विमान','हेलिकॉप्टर'].includes(vehicle);
 const W=isBike?.65:isTractor?1.9:2;
 const L=isBike?1.8:isTractor?3:3.3;

 if(vehicle==='विमान'){
  box(car,.7,.65,4,bodyMat,0,0,0);
  box(car,5,.13,1,bodyMat,0,.05,0);
  box(car,1.7,.12,.55,bodyMat,0,.5,1.5);
  const prop=new THREE.Group();prop.name='propeller';prop.position.set(0,0,-2.1);car.add(prop);
  box(prop,.12,.12,1.5,material(0x222222),0,0,0);
  box(prop,1.5,.12,.12,material(0x222222),0,0,0);
  const glass=material(0x63c8ef);
  box(car,.55,.5,.8,glass,0,.35,-.5);
 }
 else if(vehicle==='हेलिकॉप्टर'){
  box(car,1.3,1.1,2.3,bodyMat,0,0,0);
  const glass=material(0x67ccef);
  const canopy=new THREE.Mesh(new THREE.SphereGeometry(.7,16,12),glass);
  canopy.scale.set(1,.8,.9);canopy.position.set(0,.25,-.8);car.add(canopy);
  box(car,.12,.12,2,bodyMat,0,.1,1.7);
  box(car,.8,.12,.12,bodyMat,0,0,2.5);
  const rotor=new THREE.Group();rotor.name='rotor';rotor.position.y=.8;car.add(rotor);
  box(rotor,4,.07,.14,material(0x202020),0,0,0);
  box(rotor,.14,.07,4,material(0x202020),0,0,0);
  box(car,.12,.12,1.3,material(0x333333),0,-.9,0);
  box(car,1.5,.12,.12,material(0x333333),0,-.9,0);
 }
 else if(vehicle==='JCB'){
  box(car,2,.7,2.8,bodyMat,0,.7,0);
  box(car,1.2,1,1,material(0x6bc5e5),0,1.5,-.4);
  const arm=box(car,.22,.22,2,material(0x555b5d),0,1.6,-1.8);
  arm.rotation.x=-.4;
  box(car,1,.3,.5,material(0x444444),0,.35,-2.6);
 }
 else if(vehicle==='विमान'){
  box(car,.7,.6,3,bodyMat,0,0,0);
 }
 else{
  box(car,W,.7,L,bodyMat,0,.45,0);
  if(!isBike){
   box(car,W*.72,.7,L*.42,material(0x72cbed),0,1.05,-.2);
  }
  if(isTractor){
   box(car,1,.8,1,material(0x41484b),0,1.1,-.5);
   box(car,.09,.7,.09,material(0x333333),-.48,1.5,-.4);
   box(car,.09,.7,.09,material(0x333333),.48,1.5,-.4);
  }
  if(vehicle==='रोड रोलर'){
   const drum=new THREE.Mesh(new THREE.CylinderGeometry(.75,.75,1.9,24),material(0x777777));
   drum.rotation.z=Math.PI/2;drum.position.set(0,-.1,-1.3);car.add(drum);
  }
  const count=isBike?2:4;
  for(let i=0;i<count;i++){
   const x=isBike?0:(i%2===0?-W*.62:W*.62);
   const z=isBike?(i===0?-.6:.6):(i<2?-L*.32:L*.32);
   const r=isTractor?(i<2?.6:.4):.4;
   const g=new THREE.Group();g.position.set(x,r,z);car.add(g);
   const wheelMesh=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.28,20),material(0x151515));
   wheelMesh.rotation.z=Math.PI/2;g.add(wheelMesh);
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(r*.48,r*.48,.3,16),material(0xb9c2c6));
   rim.rotation.z=Math.PI/2;g.add(rim);
   wheels.push({group:g,radius:r,mesh:wheelMesh,rim});
  }
 }
 car.scale.setScalar(size);
 makeAttachment();
 updateWheels();
}
function makeAttachment(){
 const old=car.getObjectByName('attachment');
 if(old)car.remove(old);
 if(attachment==='काही नाही'||air)return;
 const g=new THREE.Group();g.name='attachment';car.add(g);
 if(attachment==='ट्रॉली'){
  box(g,1.8,.65,1.8,bodyMat,0,.85,2);
  box(g,1.9,.12,1.9,material(0x626c70),0,.5,2);
  for(const x of [-.95,.95]){
   const w=new THREE.Mesh(new THREE.CylinderGeometry(.27,.27,.2,14),material(0x111111));
   w.rotation.z=Math.PI/2;w.position.set(x,.3,2.4);g.add(w);
  }
 }else if(attachment==='फ्रंट लोडर'){
  for(const x of [-.7,.7]){
   const a=box(g,.14,.14,1.5,material(0x777777),x,.9,-1.6);a.rotation.x=-.2;
  }
  box(g,1.5,.25,.5,bodyMat,0,.3,-2.4);
 }else{
  box(g,1.8,.12,.25,material(0x555555),0,.5,2);
  for(let i=0;i<5;i++){
   const blade=new THREE.Mesh(new THREE.ConeGeometry(.16,.55,6),material(0x777777));
   blade.position.set((i-2)*.34,.35,2);blade.rotation.x=Math.PI;g.add(blade);
  }
 }
}
function updateWheels(){
 wheels.forEach(w=>{
  const r=w.radius*wheelSize;
  w.mesh.geometry.dispose();
  w.mesh.geometry=new THREE.CylinderGeometry(r,r,.28,tire==='साधा'?12:tire==='रिब्ड'?28:20);
  w.rim.geometry.dispose();
  w.rim.geometry=new THREE.CylinderGeometry(r*.48,r*.48,.3,16);
  w.group.position.y=r;
 });
}
function clearWorld(){worldObjects.forEach(o=>scene.remove(o));worldObjects=[];obstacles.forEach(o=>scene.remove(o));obstacles=[]}
function addWorld(o){scene.add(o);worldObjects.push(o)}
function makeWorld(){
 clearWorld();
 const sky=environment==='आकाश'||air;
 const bg=sky?0x4da9e8:environment==='समुद्रकिनारा'?0x8ad1ed:environment==='जंगल'?0x8ba98d:0x91c9e9;
 scene.background.set(bg);scene.fog=new THREE.Fog(bg,sky?100:55,sky?500:190);
 if(sky){
  const clouds=[];
  for(let i=0;i<45;i++){
   const g=new THREE.Group();
   for(let j=0;j<4;j++){
    const c=new THREE.Mesh(new THREE.SphereGeometry(2+Math.random()*2,10,8),material(0xffffff));
    c.position.set(j*2,Math.random(),Math.random()*2);g.add(c);
   }
   g.position.set((Math.random()-.5)*130,8+Math.random()*45,-Math.random()*400);
   addWorld(g);clouds.push(g);
  }
  return;
 }
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),material(environment==='समुद्रकिनारा'?0xd8c18b:0x477b38));
 ground.rotation.x=-Math.PI/2;ground.position.y=-.15;addWorld(ground);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(9,500),material(0x30363a));
 road.rotation.x=-Math.PI/2;road.position.y=-.08;addWorld(road);
 for(let z=-245;z<250;z+=12){
  const line=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,5),material(0xf5e9b7));
  line.position.set(0,-.04,z);addWorld(line);
 }
 for(let i=0;i<60;i++){
  const z=-240+Math.random()*480,x=(Math.random()<.5?-1:1)*(8+Math.random()*18);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15,.25,2,7),material(0x62432b));
  trunk.position.set(x,1,z);addWorld(trunk);
  const crown=new THREE.Mesh(new THREE.SphereGeometry(1.4,9,7),material(0x2e743b));
  crown.position.set(x,2.7,z);addWorld(crown);
 }
 if(['डोंगर','धबधबा'].includes(environment)){
  for(let i=0;i<16;i++){
   const hill=new THREE.Mesh(new THREE.ConeGeometry(7,14,7),material(0x657d70));
   hill.position.set(i%2?22:-22,5,-230+i*30);addWorld(hill);
  }
 }
 if(environment==='समुद्रकिनारा'){
  const sea=new THREE.Mesh(new THREE.PlaneGeometry(150,500),material(0x148cc4));
  sea.rotation.x=-Math.PI/2;sea.position.set(45,-.1,0);addWorld(sea);
 }
}
function spawnObstacle(z){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.1,2),material([0xd42d21,0x2675bd,0x777777][Math.floor(Math.random()*3)]));
 body.position.y=.65;g.add(body);
 g.position.set((Math.random()-.5)*6,0,z);
 scene.add(g);obstacles.push(g);
}
function resetObstacles(){obstacles.forEach(o=>scene.remove(o));obstacles=[];for(let z=-25;z>-120;z-=20)spawnObstacle(z)}

function setupButtons(){
 addButtonGroup('vehicles',vehicles,vehicle,v=>{vehicle=v;makeVehicle()});
 addButtonGroup('colors',colors,paint,v=>{paint=v[1];bodyMat.color.setHex(paint)});
 addButtonGroup('attachments',attachments,attachment,v=>{attachment=v;makeAttachment()});
 addButtonGroup('tires',['खोल ग्रिप','साधा','रिब्ड'],tire,v=>{tire=v;updateWheels()});
 addButtonGroup('worlds',worlds,environment,v=>{environment=v;makeWorld()});
}
$('size').oninput=e=>{size=+e.target.value/100;$('sizeText').textContent=e.target.value+'%';if(car)car.scale.setScalar(size)};
$('power').oninput=e=>{power=+e.target.value/100;$('powerText').textContent=e.target.value+'%'};
$('wheel').oninput=e=>{wheelSize=+e.target.value/100;$('wheelText').textContent=e.target.value+'%';updateWheels()};

document.querySelectorAll('.drive').forEach(b=>{
 const k=b.dataset.k;
 const down=e=>{e.preventDefault();keys[k]=true};
 const up=e=>{e.preventDefault();keys[k]=false};
 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('lostpointercapture',up);
});
const keymap={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'forward',ArrowDown:'reverse',w:'forward',s:'reverse',a:'left',d:'right'};
addEventListener('keydown',e=>{if(keymap[e.key])keys[keymap[e.key]]=true});
addEventListener('keyup',e=>{if(keymap[e.key])keys[keymap[e.key]]=false});

let audio=null,musicOn=true,volume=.5,oscillators=[],engineOsc=null,engineGain=null;
function startAudio(){
 if(audio)return;
 audio=new (window.AudioContext||window.webkitAudioContext)();
 engineOsc=audio.createOscillator();engineOsc.type='sawtooth';
 engineGain=audio.createGain();engineGain.gain.value=0;
 engineOsc.connect(engineGain);engineGain.connect(audio.destination);engineOsc.start();
}
function beep(freq,duration=.15){
 if(!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.frequency.value=freq;g.gain.setValueAtTime(volume*.16,audio.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
 o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration);
}
let musicTimer=null,musicIndex=0;
const melody=[262,330,392,330,294,349,440,392,262,330,392,523,440,392,330,294];
function music(){
 if(!audio||!musicOn||musicTimer)return;
 musicTimer=setInterval(()=>{
  if(!musicOn)return;
  beep(melody[musicIndex%melody.length],.23);
  if(musicIndex%4===0)beep(110,.12);
  musicIndex++;
 },260);
}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
$('musicBtn').onclick=()=>{
 musicOn=!musicOn;
 $('musicBtn').textContent=musicOn?'🎵 MUSIC ON':'🔇 MUSIC OFF';
 if(musicOn)music();else stopMusic();
};
$('volumeBtn').onclick=()=>{
 volume=volume===.5?.9:volume===.9?.2:.5;
 $('volumeBtn').textContent='🔊 आवाज '+Math.round(volume*100)+'%';
};

let warningSoundAt=0;
function warningSound(){
 if(!audio)return;
 const now=performance.now();
 if(now-warningSoundAt>750){beep(880,.16);warningSoundAt=now}
}
function crashEffect(){
 beep(75,.5);
 $('msg').textContent='💥 CRASH!';
 document.body.animate([{transform:'translate(0,0)'},{transform:'translate(5px,-3px)'},{transform:'translate(-5px,3px)'},{transform:'translate(0,0)'}],{duration:300});
 setTimeout(()=>$('msg').textContent='',700);
}
$('cameraBtn').onclick=()=>{cameraMode=cameraMode==='chase'?'cabin':'chase';$('cameraBtn').textContent=cameraMode==='chase'?'📷 मागून':'📷 केबिन'};
$('rearBtn').onclick=()=>{rear=!rear;$('rearBtn').textContent=rear?'↪ पुढील दृश्य':'↩ मागील दृश्य'};
$('garageBtn').onclick=()=>{
 playing=false;$('garage').style.display='flex';$('controls').style.display='none';$('airControls').style.display='none';$('tools').style.display='none';$('sound').style.display='none';
};

$('start').onclick=()=>{
 startAudio();if(audio.state==='suspended')audio.resume();
 stopMusic();if(musicOn)music();
 makeVehicle();makeWorld();resetObstacles();
 velocity=0;points=0;altitude=air?22:0;playing=true;
 $('garage').style.display='none';
 $('controls').style.display=air?'none':'flex';
 $('airControls').style.display=air?'flex':'none';
 $('tools').style.display='flex';$('sound').style.display='flex';
};

setupButtons();makeVehicle();makeWorld();

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 if(playing&&car){
  const max=(air?27:17)*power;
  if(keys.forward)velocity=Math.min(max,velocity+12*dt);
  else if(keys.reverse)velocity=Math.max(-max*.5,velocity-12*dt);
  else velocity*=Math.pow(.985,dt*60);
  if(Math.abs(velocity)<.04)velocity=0;

  car.position.z-=velocity*dt;
  const steer=(keys.left?1:0)-(keys.right?1:0);
  car.position.x=THREE.MathUtils.clamp(car.position.x+steer*(air?9:3+Math.abs(velocity)*.1)*dt,air?-55:-3.4,air?55:3.4);

  if(air){
   if(keys.up)altitude+=12*dt;
   if(keys.down)altitude-=12*dt;
   altitude=THREE.MathUtils.clamp(altitude,3,85);
   car.position.y=altitude;
   car.rotation.z=-steer*.18;
   car.rotation.x=keys.up?-.08:keys.down?.08:0;
   const rotor=car.getObjectByName(vehicle==='हेलिकॉप्टर'?'rotor':'propeller');
   if(rotor)rotor.rotation.y+=dt*22;
  }else{
   car.position.y=0;
   car.rotation.y=THREE.MathUtils.lerp(car.rotation.y,-steer*.2,.08);
   wheels.forEach(w=>w.group.rotation.x-=velocity*dt/(w.radius*wheelSize));
  }

  if(engineGain&&engineOsc){
   engineOsc.frequency.setTargetAtTime(air?95+Math.abs(velocity)*8:45+Math.abs(velocity)*7,audio.currentTime,.08);
   engineGain.gain.setTargetAtTime(playing?volume*.055:0,audio.currentTime,.1);
  }

  if(obstacles.length<7)spawnObstacle(car.position.z-120);
  let danger=false;
  for(let i=obstacles.length-1;i>=0;i--){
   const o=obstacles[i];
   const dz=Math.abs(o.position.z-car.position.z);
   const dx=Math.abs(o.position.x-car.position.x);
   const dy=air?Math.abs(o.position.y-car.position.y):0;
   if(dz<18&&dx<2.2&&(!air||dy<5))danger=true;
   if(dz<2.1&&dx<1.4&&(!air||dy<3)){
    velocity*=.2;
    crashEffect();
    o.position.z=car.position.z-35;
   }
   if(o.position.z>car.position.z+15){
    scene.remove(o);obstacles.splice(i,1);points+=10;
   }
  }
  $('warning').style.display=danger?'block':'none';
  if(danger)warningSound();
  $('score').textContent=points;
  $('speed').textContent=Math.round(Math.abs(velocity)*5);

  if(cameraMode==='cabin'){
   camera.position.set(car.position.x,car.position.y+1.7,car.position.z+(rear?-1: -.8));
   camera.lookAt(car.position.x,car.position.y+1.5,car.position.z+(rear?12:-12));
  }else{
   const behind=rear?-1:1;
   const target=new THREE.Vector3(car.position.x,car.position.y+(air?5:5),car.position.z+behind*(air?14:10));
   camera.position.lerp(target,.12);
   camera.lookAt(car.position.x,car.position.y,car.position.z);
  }
 }else{
  $('warning').style.display='none';
  camera.position.lerp(new THREE.Vector3(7,7,10),.03);
  camera.lookAt(0,1,0);
 }
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
