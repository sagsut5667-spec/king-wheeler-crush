<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<title>KING WHEELER CRUSH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#101820;color:white;
  font-family:Arial,sans-serif;
  min-height:100vh;overflow:hidden;
}
.game{
  min-height:100vh;display:flex;
  flex-direction:column;align-items:center;
  justify-content:center;text-align:center;
  padding:24px;
  background:
  linear-gradient(#07131c66,#07131cdd),
  url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200')
  center/cover;
}
h1{
  color:#ffc400;font-size:clamp(34px,8vw,58px);
  font-weight:900;text-shadow:0 4px 15px #000;
  letter-spacing:2px;
}
h2{font-size:19px;margin-top:12px;letter-spacing:4px}
.vehicle{
  font-size:100px;margin:35px 0;
  filter:drop-shadow(0 10px 12px #000);
  animation:bounce 2s infinite ease-in-out;
}
@keyframes bounce{
  50%{transform:translateY(-12px) rotate(-3deg)}
}
button{
  background:linear-gradient(135deg,#ffdc36,#e66a00);
  color:#111;border:0;border-radius:14px;
  padding:17px 55px;font-size:22px;
  font-weight:900;cursor:pointer;
  box-shadow:0 6px 25px #ff9d0070;
}
#status{margin-top:25px;color:#ddd;font-size:14px}
footer{position:absolute;bottom:18px;color:#bbb;font-size:12px}
</style>
</head>
<body>
<main class="game">
  <h1>KING WHEELER</h1>
  <h2>CRUSH 3D</h2>
  <div class="vehicle">🚜</div>
  <button onclick="startGame()">PLAY NOW</button>
  <p id="status">GET READY FOR THE ULTIMATE CRUSH!</p>
  <footer>© KING WHEELER CRUSH</footer>
</main>
<script>
function startGame(){
 document.getElementById("status").textContent =
 "YOUR ADVENTURE IS COMING SOON!";
}
</script>
</body>
</html>
