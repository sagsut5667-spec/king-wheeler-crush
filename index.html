
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KING WHEELER CRUSH</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101820;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
#hud{position:fixed;top:15px;left:0;width:100%;text-align:center;color:white;pointer-events:none;text-shadow:0 2px 8px #000}
#hud h1{margin:0;font-size:25px;letter-spacing:3px;color:#ffd54a}
#hud p{margin:5px;font-size:12px;letter-spacing:2px}
#controls{position:fixed;bottom:25px;width:100%;display:flex;justify-content:space-between;padding:0 25px}
.control{width:75px;height:65px;border:2px solid #ffffff88;border-radius:16px;background:#111c;color:white;font-size:30px}
#status{position:fixed;bottom:105px;width:100%;text-align:center;color:white;font-size:13px;text-shadow:0 2px 5px black;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
<h1>KING WHEELER</h1>
<p>CRUSH 3D • JUNGLE ROAD</p>
</div>
<div id="status">DRIVE YOUR VEHICLE</div>
<div id="controls">
<button class="control" id="left">◀</button>
<button class="control" id="right">▶</button>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,35,150);

const camera = new THREE.PerspectiveCamera(
65, window.innerWidth/window.innerHeight,0.1,300
);
camera.position.set(0,6,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('game').appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.HemisphereLight(0xffffff,0x45602d,2));
const sun = new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-10,20,10);
sun.castShadow=true;
scene.add(sun);

// MATERIALS
const green = new THREE.MeshStandardMaterial({color:0x27632c});
const darkGreen = new THREE.MeshStandardMaterial({color:0x174522});
const roadMat = new THREE.MeshStandardMaterial({color:0x33383b});
const yellow = new THREE.MeshStandardMaterial({color:0xffc928});
const black = new THREE.MeshStandardMaterial({color:0x171717});
const glass = new THREE.MeshStandardMaterial({color:0x7ec8df,metalness:0.3,roughness:0.2});

// GROUND
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(200,250),
 new THREE.MeshStandardMaterial({color:0x4c8c3b})
);
ground.rotation.x=-Math.PI/2;
ground.position.z=-80;
ground.receiveShadow=true;
scene.add(ground);

// ROAD
const road = new THREE.Mesh(
 new THREE.PlaneGeometry(9,250),roadMat
);
road.rotation.x=-Math.PI/2;
road.position.set(0,0.02,-80);
road.receiveShadow=true;
scene.add(road);

// ROAD LINES
for(let z=35;z>-190;z-=12){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(0.18,0.035,5),
  new THREE.MeshStandardMaterial({color:0xffffff})
 );
 line.position.set(0,0.05,z);
 scene.add(line);
}

// JUNGLE TREES
function tree(x,z,size){
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.2*size,0.3*size,2*size,8),
  new THREE.MeshStandardMaterial({color:0x684326})
 );
 trunk.position.set(x,size,z);
 trunk.castShadow=true;
 scene.add(trunk);

 for(let i=0;i<3;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(1.3*size,2.5*size,8),
   i%2?green:darkGreen
  );
  leaves.position.set(x,(2+i*0.65)*size,z);
  leaves.castShadow=true;
  scene.add(leaves);
 }
}
for(let z=30;z>-190;z-=9){
 tree(-8-Math.random()*12,z,0.8+Math.random()*1.2);
 tree(8+Math.random()*12,z,0.8+Math.random()*1.2);
}

// HILLS
for(let i=0;i<12;i++){
 const hill=new THREE.Mesh(
  new THREE.SphereGeometry(1,16,12),
  new THREE.MeshStandardMaterial({color:0x477c48})
 );
 hill.scale.set(12+Math.random()*8,5+Math.random()*6,8);
 hill.position.set(i%2?22:-22,1,-20-i*17);
 scene.add(hill);
}

// VEHICLE
const vehicle=new THREE.Group();
scene.add(vehicle);

const body=new THREE.Mesh(
 new THREE.BoxGeometry(2.2,0.75,3.5),yellow
);
body.position.y=1.05;
body.castShadow=true;
vehicle.add(body);

const cabin=new THREE.Mesh(
 new THREE.BoxGeometry(1.65,1.1,1.5),
 yellow
);
cabin.position.set(0,1.85,0.3);
cabin.castShadow=true;
vehicle.add(cabin);

const windshield=new THREE.Mesh(
 new THREE.BoxGeometry(1.35,0.65,0.08),glass
);
windshield.position.set(0,1.9,1.07);
vehicle.add(windshield);

const wheels=[];
for(const x of [-1.15,1.15]){
 for(const z of [-1.1,1.1]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(0.48,0.48,0.35,20),
   black
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,0.55,z);
  wheel.castShadow=true;
  vehicle.add(wheel);
  wheels.push(wheel);
 }
}
vehicle.position.set(0,0,5);

// GAME MOVEMENT
let direction=0;
let speed=0;

function setDirection(value){direction=value;}
document.getElementById('left').addEventListener('pointerdown',()=>setDirection(-1));
document.getElementById('right').addEventListener('pointerdown',()=>setDirection(1));
['left','right'].forEach(id=>{
 document.getElementById(id).addEventListener('pointerup',()=>setDirection(0));
 document.getElementById(id).addEventListener('pointerleave',()=>setDirection(0));
 document.getElementById(id).addEventListener('pointercancel',()=>setDirection(0));
});

window.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key==='a')direction=-1;
 if(e.key==='ArrowRight'||e.key==='d')direction=1;
});
window.addEventListener('keyup',()=>direction=0);

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const delta=Math.min(clock.getDelta(),0.04);

 speed+= (direction*8-speed)*delta*3;
 vehicle.position.x+=speed*delta;
 vehicle.position.x=THREE.MathUtils.clamp(vehicle.position.x,-3.1,3.1);

 wheels.forEach(w=>w.rotation.x+=delta*2);

 camera.position.x+=(vehicle.position.x*0.45-camera.position.x)*delta*3;
 camera.lookAt(vehicle.position.x,1,-2);

 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
