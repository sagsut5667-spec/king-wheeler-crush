
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>KING WHEELER CRUSH</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#17232b;color:white;font-family:Arial,sans-serif}
#game{position:fixed;inset:0}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#101b22dd;padding:9px;border-radius:10px;font-weight:bold}
#garage{position:fixed;inset:0;background:linear-gradient(130deg,#07131bf5,#17402ff0);display:flex;align-items:center;justify-content:center;padding:10px;overflow:auto}
.panel{width:min(900px,100%);max-height:96%;overflow:auto;background:#0c171df5;border:1px solid #71818a;border-radius:16px;padding:14px}
h1{color:#ffc928;margin:0;font-size:clamp(24px,5vw,40px)}
h2{font-size:15px;color:#ffe08a;margin:10px 0 6px}
.note{font-size:12px;color:#cbd6db;margin:4px 0 8px}
.group{border-top:1px solid #ffffff25;padding-top:5px;margin-top:7px}
.buttons{display:flex;flex-wrap:wrap;gap:6px}
button{background:#263943;color:white;border:1px solid #819099;border-radius:9px;padding:9px 11px;font-weight:bold;font-size:12px;touch-action:manipulation}
button.active{background:#a86a05;border-color:#ffdb72}
label{display:block;font-size:12px;margin:7px 0 2px}
input[type=range]{width:min(250px,100%);accent-color:#ffc928}
#start{margin-top:12px;padding:13px 25px;font-size:17px;background:linear-gradient(130deg,#ffcf28,#ed7800);color:#1a160b;border:0}
#controls{position:fixed;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(2,54px);gap:7px;pointer-events:auto}
.drive{width:54px;height:54px;padding:0;font-size:23px;background:#0b151bdc;border:2px solid #ffffffaa}
#tools{position:fixed;right:8px;top:58px;display:none;flex-direction:column;gap:5px}
#hint{position:fixed;bottom:132px;left:50%;transform:translateX(-50%);background:#071016c9;padding:6px 9px;border-radius:8px;font-size:11px;white-space:nowrap;display:none}
#msg{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:bold;color:#ffe078}
@media(max-width:550px){.panel{padding:10px}.pad{grid-template-columns:repeat(2,50px)}.drive{width:50px;height:50px}}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
 <div class="pill">🏁 KING WHEELER CRUSH</div>
 <div class="pill">स्कोअर <span id="score">0</span> | <span id="spd">0</span> km/h</div>
</div>

<div id="tools">
 <button id="cam">📷 मागून</button>
 <button id="rear">↩ मागील दृश्य</button>
 <button id="garageBtn">🔧 गॅरेज</button>
</div>

<div id="hint">▲ पुढे　▼ रिव्हर्स　◀ ▶ वळवा</div>

<div id="controls">
 <div class="pad">
  <button class="drive" data-k="left">◀</button>
  <button class="drive" data-k="right">▶</button>
 </div>
 <div class="pad">
  <button class="drive" data-k="reverse">▼</button>
  <button class="drive" data-k="forward">▲</button>
 </div>
</div>

<div id="msg"></div>

<div id="garage">
 <div class="panel">
  <h1>KING WHEELER CRUSH</h1>
  <div class="note">3D ड्रायव्हिंग गेम • गॅरेज • वाहन कस्टमायझेशन</div>

  <div class="group">
   <h2>वाहन निवडा</h2>
   <div class="buttons" id="vehicles"></div>
  </div>

  <div class="group">
   <h2>रंग बदला</h2>
   <div class="buttons" id="colors"></div>
  </div>

  <div class="group">
   <h2>अवजारे / जोडणी</h2>
   <div class="buttons" id="implements"></div>
  </div>

  <div class="group">
   <h2>टायर डिझाइन</h2>
   <div class="buttons" id="tires"></div>
  </div>

  <div class="group">
   <h2>कस्टमायझेशन</h2>
   <label>वाहनाचा आकार: <b id="sizeVal">100%</b></label>
   <input id="size" type="range" min="80" max="125" value="100">

   <label>कमाल वेग: <b id="speedVal">100%</b></label>
   <input id="speedRange" type="range" min="60" max="160" value="100">

   <label>टायरचा आकार: <b id="wheelVal">100%</b></label>
   <input id="wheel" type="range" min="75" max="145" value="100">
  </div>

  <div class="group">
   <h2>मैदान निवडा</h2>
   <div class="buttons" id="worlds"></div>
  </div>

  <button id="start">गेम सुरू करा ▶</button>
  <div class="note">▲ पुढे, ▼ रिव्हर्स, ◀ ▶ वळवण्यासाठी.</div>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9e9);
scene.fog=new THREE.Fog(0x91c9e9,55,190);

const camera=new THREE.PerspectiveCamera(
 65,innerWidth/innerHeight,.1,500
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
$('game').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xeaf7ff,0x526044,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-15,30,18);
sun.castShadow=true;
scene.add(sun);

const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({
 color:c,roughness:r
});

const roadMat=mat(0x30363a);
const grassMat=mat(0x477b38);
const lineMat=mat(0xf6e8b1);
const treeMat=mat(0x2e743b);
const trunkMat=mat(0x62432b);
const metal=mat(0x69747a);

let vehicle='ट्रॅक्टर क्लासिक';
let paint=0xffc928;
let attachment='काही नाही';
let tire='खोल ग्रिप';
let environment='गाव';

let size=1;
let power=1;
let wheelSize=1;

let car=null;
let paintMaterial=null;
let wheels=[];
let worldObjects=[];
let traffic=[];

let velocity=0;
let points=0;
let playing=false;
let cameraMode='chase';
let rearView=false;

const keys={
 left:false,right:false,forward:false,reverse:false
};

const vehicles=[
 'ट्रॅक्टर क्लासिक','ट्रॅक्टर मॉडर्न',
 'ट्रॅक्टर हेवी','ट्रॅक्टर कॉम्पॅक्ट',
 'बाईक','स्कूटर','कार','जीप','ट्रक',
 'रोड रोलर','JCB','ट्रेन','विमान'
];

const colors=[
 ['पिवळा',0xffc928],
 ['लाल',0xd92d24],
 ['निळा',0x1976d2],
 ['हिरवा',0x229447],
 ['काळा',0x20252b],
 ['नारिंगी',0xf07816]
];

const attachments=[
 'काही नाही','ट्रॉली','नांगर',
 'कल्टिव्हेटर','रोटाव्हेटर','फ्रंट लोडर'
];

const worlds=[
 'गाव','जंगल','डोंगर',
 'समुद्रकिनारा','हायवे','धबधबा'
];

function buttons(id,items,isActive,action){
 const el=$(id);
 el.innerHTML='';

 items.forEach(v=>{
  const b=document.createElement('button');
  b.textContent=Array.isArray(v)?v[0]:v;

  if(isActive(v))b.classList.add('active');

  b.onclick=()=>{
   action(v);
   [...el.children].forEach(x=>x.classList.remove('active'));
   b.classList.add('active');
  };

  el.appendChild(b);
 });
}

function box(parent,w,h,d,material,x,y,z){
 const o=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),material
 );
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

function buildVehicle(){
 if(car)scene.remove(car);

 wheels=[];
 paintMaterial=mat(paint,.45);
 car=new THREE.Group();
 scene.add(car);

 const tractor=vehicle.startsWith('ट्रॅक्टर');
 const bike=['बाईक','स्कूटर'].includes(vehicle);
 const big=['ट्रक','ट्रेन','विमान'].includes(vehicle);

 const W=bike?.6:tractor?1.8:big?2.4:1.7;
 const L=bike?1.6:tractor?2.8:big?4.2:2.8;

 if(vehicle==='JCB'){
  box(car,2,.7,2.8,paintMaterial,0,.85,0);
  box(car,1.3,1,1.2,mat(0x70c9e8),0,1.55,-.4);
  let arm=box(car,.24,.24,2,metal,0,1.7,-1.8);
  arm.rotation.x=-.4;
  box(car,1,.3,.55,metal,0,.4,-2.7);
 }
 else if(vehicle==='रोड रोलर'){
  box(car,2,1,2.7,paintMaterial,0,1,0);
  let drum=new THREE.Mesh(
   new THREE.CylinderGeometry(.8,.8,1.9,24),metal
  );
  drum.rotation.z=Math.PI/2;
  drum.position.set(0,.8,-1.4);
  car.add(drum);
 }
 else if(vehicle==='विमान'){
  box(car,.7,.7,4,paintMaterial,0,1.2,0);
  box(car,5,.14,1,paintMaterial,0,1.2,0);
  box(car,1.6,.12,.6,paintMaterial,0,1.6,1.6);
 }
 else if(vehicle==='ट्रेन'){
  box(car,2.1,1.6,4.2,paintMaterial,0,1.3,0);
  box(car,1.8,.8,1,mat(0x70c9e8),0,2.2,-.7);
 }
 else{
  box(car,W,.65,L,paintMaterial,0,bike?.85:1,0);

  if(bike){
   let tank=new THREE.Mesh(
    new THREE.SphereGeometry(.4,16,12),paintMaterial
   );
   tank.scale.set(1,.7,1);
   tank.position.set(0,1.25,-.1);
   car.add(tank);
  }
  else{
   box(car,W*.72,.72,L*.42,mat(0x70c9e8),0,1.65,-.15);

   if(tractor){
    box(car,1,.9,1.1,metal,0,1.8,-.35);
    for(let x of [-.5,.5]){
     box(car,.08,.85,.08,metal,x,2.2,-.35);
    }
   }
  }
 }

 const n=bike?2:4;

 for(let i=0;i<n;i++){
  let z=bike?(i?-.58:.58):(i<2?-L*.32:L*.32);
  let x=bike?0:(i%2===0?-W*.62:W*.62);
  let r=tractor?(i<2?.62:.43):.42;

  let g=new THREE.Group();
  g.position.set(x,r,z);
  car.add(g);

  let t=new THREE.Mesh(
   new THREE.CylinderGeometry(r,r,.28,20),
   mat(0x17191b)
  );
  t.rotation.z=Math.PI/2;
  g.add(t);

  let rim=new THREE.Mesh(
   new THREE.CylinderGeometry(r*.5,r*.5,.3,16),
   mat(0xb8c0c4)
  );
  rim.rotation.z=Math.PI/2;
  g.add(rim);

  wheels.push({group:g,tire:t,radius:r});
 }

 car.scale.setScalar(size);
 buildAttachment();
 updateWheels();
}

function buildAttachment(){
 if(!car)return;

 let old=car.getObjectByName('attachment');
 if(old)car.remove(old);

 if(attachment==='काही नाही')return;

 let g=new THREE.Group();
 g.name='attachment';
 car.add(g);

 if(attachment==='ट्रॉली'){
  box(g,1.8,.65,1.7,paintMaterial,0,.95,2.15);
  box(g,1.9,.12,1.8,metal,0,.58,2.15);

  for(let x of [-.95,.95]){
   let w=new THREE.Mesh(
    new THREE.CylinderGeometry(.27,.27,.2,14),
    mat(0x171717)
   );
   w.rotation.z=Math.PI/2;
   w.position.set(x,.35,2.5);
   g.add(w);
  }
 }
 else if(attachment==='फ्रंट लोडर'){
  for(let x of [-.7,.7]){
   let a=box(g,.15,.15,1.7,metal,x,1,-1.8);
   a.rotation.x=-.2;
  }
  box(g,1.55,.25,.6,paintMaterial,0,.4,-2.6);
 }
 else{
  for(let i=0;i<5;i++){
   let blade=new THREE.Mesh(
    new THREE.ConeGeometry(.17,.55,6),metal
   );
   blade.position.set((i-2)*.32,.45,1.9+i*.18);
   blade.rotation.x=Math.PI;
   g.add(blade);
  }
  box(g,1.8,.12,.25,metal,0,.7,2.15);
 }
}

function updateWheels(){
 for(let w of wheels){
  let r=w.radius*wheelSize;

  w.tire.geometry.dispose();
  w.tire.geometry=new THREE.CylinderGeometry(
   r,r,.28,tire==='साधा'?12:tire==='रिब्ड'?28:20
  );

  w.group.children[1].geometry.dispose();
  w.group.children[1].geometry=new THREE.CylinderGeometry(
   r*.5,r*.5,.3,16
  );

  w.group.position.y=r;
 }
}

function buildWorld(){
 for(let o of worldObjects)scene.remove(o);
 worldObjects=[];

 for(let o of traffic)scene.remove(o);
 traffic=[];

 let bg=environment==='समुद्रकिनारा'?0x83cce8:
 environment==='जंगल'?0x8db7a0:0x91c9e9;

 scene.background.set(bg);
 scene.fog.color.set(bg);

 let ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),grassMat
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.12;
 scene.add(ground);
 worldObjects.push(ground);

 let road=new THREE.Mesh(
  new THREE.PlaneGeometry(9,500),roadMat
 );
 road.rotation.x=-Math.PI/2;
 road.position.y=-.08;
 scene.add(road);
 worldObjects.push(road);

 for(let z=-240;z<250;z+=12){
  let s=new THREE.Mesh(
   new THREE.BoxGeometry(.13,.025,5),lineMat
  );
  s.position.set(0,-.045,z);
  scene.add(s);
  worldObjects.push(s);
 }

 let count=environment==='जंगल'?75:
 environment==='गाव'?35:22;

 for(let i=0;i<count;i++){
  let z=-240+Math.random()*480;
  let x=(Math.random()<.5?-1:1)*(7+Math.random()*20);

  let tr=new THREE.Mesh(
   new THREE.CylinderGeometry(.18,.26,2.3,7),trunkMat
  );
  tr.position.set(x,1.05,z);
  scene.add(tr);
  worldObjects.push(tr);

  let crown=new THREE.Mesh(
   new THREE.SphereGeometry(1.25,9,7),treeMat
  );
  crown.position.set(x,2.7,z);
  scene.add(crown);
  worldObjects.push(crown);
 }

 if(['डोंगर','समुद्रकिनारा','धबधबा'].includes(environment)){
  for(let i=0;i<15;i++){
   let h=new THREE.Mesh(
    new THREE.ConeGeometry(7,13,7),
    mat(environment==='समुद्रकिनारा'?0xd6c18c:0x647d69)
   );
   h.position.set((i%2?1:-1)*22,4,-220+i*30);
   scene.add(h);
   worldObjects.push(h);
  }
 }
}

function spawn(z){
 let g=new THREE.Group();

 let body=new THREE.Mesh(
  new THREE.BoxGeometry(1.4,1.15,2),
  mat([0xd33b28,0x2875bd,0x999999][Math.floor(Math.random()*3)])
 );
 body.position.y=.65;
 g.add(body);

 g.position.set((Math.random()-.5)*6.2,0,z);
 scene.add(g);
 traffic.push(g);
}

function resetTraffic(){
 traffic.forEach(o=>scene.remove(o));
 traffic=[];
 for(let z=-25;z>-115;z-=18)spawn(z);
}

function initButtons(){
 buttons('vehicles',vehicles,v=>v===vehicle,v=>{
  vehicle=v;
  buildVehicle();
 });

 buttons('colors',colors,v=>v[1]===paint,v=>{
  paint=v[1];
  if(paintMaterial)paintMaterial.color.setHex(paint);
 });

 buttons('implements',attachments,v=>v===attachment,v=>{
  attachment=v;
  buildAttachment();
 });

 buttons('tires',['खोल ग्रिप','साधा','रिब्ड'],v=>v===tire,v=>{
  tire=v;
  updateWheels();
 });

 buttons('worlds',worlds,v=>v===environment,v=>{
  environment=v;
  buildWorld();
 });
}

$('size').oninput=e=>{
 size=+e.target.value/100;
 $('sizeVal').textContent=e.target.value+'%';
 if(car)car.scale.setScalar(size);
};

$('speedRange').oninput=e=>{
 power=+e.target.value/100;
 $('speedVal').textContent=e.target.value+'%';
};

$('wheel').oninput=e=>{
 wheelSize=+e.target.value/100;
 $('wheelVal').textContent=e.target.value+'%';
 updateWheels();
};

function setKey(k,v){keys[k]=v;}

document.querySelectorAll('.drive').forEach(b=>{
 let k=b.dataset.k;

 let down=e=>{
  e.preventDefault();
  setKey(k,true);
 };

 let up=e=>{
  e.preventDefault();
  setKey(k,false);
 };

 b.addEventListener('pointerdown',down);
 b.addEventListener('pointerup',up);
 b.addEventListener('pointercancel',up);
 b.addEventListener('lostpointercapture',up);
});

const keyMap={
 ArrowLeft:'left',ArrowRight:'right',
 ArrowUp:'forward',ArrowDown:'reverse',
 a:'left',d:'right',w:'forward',s:'reverse'
};

addEventListener('keydown',e=>{
 if(keyMap[e.key])keys[keyMap[e.key]]=true;
});

addEventListener('keyup',e=>{
 if(keyMap[e.key])keys[keyMap[e.key]]=false;
});

$('cam').onclick=()=>{
 cameraMode=cameraMode==='chase'?'cabin':'chase';
 $('cam').textContent=cameraMode==='chase'?'📷 मागून':'📷 केबिन';
};

$('rear').onclick=()=>{
 rearView=!rearView;
 $('rear').textContent=rearView?'↪ पुढील दृश्य':'↩ मागील दृश्य';
};

$('garageBtn').onclick=()=>{
 playing=false;
 $('garage').style.display='flex';
 $('controls').style.display='none';
 $('tools').style.display='none';
 $('hint').style.display='none';
};

$('start').onclick=()=>{
 buildVehicle();
 buildWorld();
 resetTraffic();

 velocity=0;
 points=0;
 playing=true;

 $('garage').style.display='none';
 $('controls').style.display='flex';
 $('tools').style.display='flex';
 $('hint').style.display='block';
};

initButtons();
buildVehicle();
buildWorld();

const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 let dt=Math.min(clock.getDelta(),.04);

 if(playing&&car){

  let max=17*power;

  if(keys.forward){
   velocity=Math.min(max,velocity+12*dt);
  }
  else if(keys.reverse){
   velocity=Math.max(-max*.55,velocity-12*dt);
  }
  else{
   velocity*=Math.pow(.985,dt*60);
  }

  if(Math.abs(velocity)<.04)velocity=0;

  car.position.z-=velocity*dt;

  let steer=(keys.left?1:0)-(keys.right?1:0);

  car.position.x=THREE.MathUtils.clamp(
   car.position.x+steer*(3.2+Math.abs(velocity)*.12)*dt,
   -3.35,3.35
  );

  wheels.forEach(w=>{
   w.group.rotation.x-=velocity*dt/(w.radius*wheelSize);
  });

  if(traffic.length<7){
   spawn(car.position.z-110);
  }

  for(let i=traffic.length-1;i>=0;i--){
   let o=traffic[i];

   if(
    Math.abs(o.position.z-car.position.z)<2 &&
    Math.abs(o.position.x-car.position.x)<1.3
   ){
    velocity*=.25;
    $('msg').textContent='💥 धडक!';
    setTimeout(()=>$('msg').textContent='',600);
   }

   if(o.position.z>car.position.z+15){
    scene.remove(o);
    traffic.splice(i,1);
    points+=10;
   }
  }

  $('score').textContent=points;
  $('spd').textContent=Math.round(Math.abs(velocity)*5);

  if(cameraMode==='cabin'){
   camera.position.set(
    car.position.x,2.2,
    car.position.z+(rearView?-1:-.7)
   );

   camera.lookAt(
    car.position.x,1.5,
    car.position.z+(rearView?9:-12)
   );
  }
  else{
   let zdir=rearView?-1:1;

   camera.position.lerp(
    new THREE.Vector3(
     car.position.x,5.2,
     car.position.z+zdir*10
    ),.13
   );

   camera.lookAt(
    car.position.x,1.1,car.position.z
   );
  }
 }
 else if(car){
  camera.position.lerp(new THREE.Vector3(7,7,10),.04);
  camera.lookAt(0,1,0);
 }

 renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
